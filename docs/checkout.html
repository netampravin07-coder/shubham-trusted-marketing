<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - SHUBHAM TRUSTED MARKETING</title>
<style>
body{
 background:#0b1020;
 color:white;
 font-family:Arial;
 text-align:center;
 padding:20px;
}
.box{
 max-width:420px;
 margin:40px auto;
 padding:25px;
 background:#18223c;
 border-radius:15px;
}
h1{color:#f5c451}
button{
 padding:12px 25px;
 border:0;
 border-radius:8px;
 background:#eab83f;
 font-weight:bold;
}
</style>
</head>
<body>
<div class="box">
<h1>Checkout</h1>
<h2 id="product">Loading...</h2>
<h2 id="price"></h2>
<button id="placeOrder">Place Order & Continue</button>

<script type="module">
import "./firebase.js";

document.getElementById("placeOrder").onclick = async () => {
  const params = new URLSearchParams(location.search);
  const name = params.get("name") || "";
  const price = Number(params.get("price"));

  try {
    await window.createOrder(name, price);
    location.href = "payment.html?" + new URLSearchParams({
      name,
      price
    });
  } catch (error) {
    alert(error.message);
  }
};
</script>
<button onclick="history.back()">Go Back</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("product").textContent =
"Product: " + (params.get("name") || "Not selected");

document.getElementById("price").textContent =
"Price: ₹" + (params.get("price") || "0");
</script>
</body>
</html>
